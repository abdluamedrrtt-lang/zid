<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الأصناف والمنيو | مطبخ زاد</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { padding: 20px; max-width: 600px; margin: 0 auto; background-color: #121212; color: #fff; }
        .admin-card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .view-btn { background: #d9534f; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #444; border-radius: 8px; background: #2a2a2a; color: #fff; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        .save-btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Tajawal', sans-serif; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h2>⚙️ لوحة إدارة الأصناف والمنيو</h2>
        <a href="index.html" class="view-btn">معاينة المنيو 👁️</a>
    </div>

    <div class="admin-card">
        <h3 style="color: #e67e22; margin-bottom: 15px;">+ إضافة وجبة جديدة</h3>
        <form id="add-meal-form">
            <input type="text" id="meal-name" placeholder="اسم الوجبة (مثال: ريزو)" required>
            <input type="number" id="meal-price" placeholder="السعر (د.ع) مثال: 6000" required>
            <input type="text" id="meal-category" placeholder="القسم (مثال: ريزو، برغر، مقبلات)" required>
            <input type="url" id="meal-image" placeholder="رابط صورة الوجبة (URL)" required>
            <textarea id="meal-desc" placeholder="وصف الوجبة والمكونات"></textarea>
            <button type="submit" class="save-btn">حفظ وإضافة للمنيو</button>
        </form>
    </div>

    <div class="admin-card">
        <h3>قائمة الأصناف الحالية</h3>
        <div id="admin-items-list" style="margin-top: 15px;">
            <!-- تظهر الوجبات المضافة هنا -->
        </div>
    </div>

    <script>
        // جلب البيانات المخزنة
        let menuData = JSON.parse(localStorage.getItem('zad_menu')) || [];

        // عرض الوجبات في لوحة التحكم
        function displayAdminItems() {
            const list = document.getElementById('admin-items-list');
            if (menuData.length === 0) {
                list.innerHTML = '<p style="color:#888;">لا توجد وجبات مضافة حالياً.</p>';
                return;
            }
            list.innerHTML = menuData.map((item, index) => `
                <div class="item-row">
                    <div>
                        <strong>${item.name}</strong> - ${Number(item.price).toLocaleString()} د.ع <br>
                        <small style="color:#aaa;">القسم: ${item.category}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteMeal(${index})">حذف</button>
                </div>
            `).join('');
        }

        // إضافة وجبة جديدة
        document.getElementById('add-meal-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('meal-name').value.trim();
            const price = parseFloat(document.getElementById('meal-price').value);
            const category = document.getElementById('meal-category').value.trim();
            const image = document.getElementById('meal-image').value.trim();
            const desc = document.getElementById('meal-desc').value.trim();

            const newMeal = { name, price, category, image, desc };
            
            menuData.push(newMeal);
            localStorage.setItem('zad_menu', JSON.stringify(menuData));

            alert('✅ تم حفظ الوجبة بنجاح وإضافتها للمنيو!');
            this.reset();
            displayAdminItems();
        });

        // حذف وجبة
        function deleteMeal(index) {
            if (confirm('هل أنت تأكد من حذف هذه الوجبة؟')) {
                menuData.splice(index, 1);
                localStorage.setItem('zad_menu', JSON.stringify(menuData));
                displayAdminItems();
            }
        }

        // عند التحميل الأول
        displayAdminItems();
    </script>
</body>
</html>
