<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الأصناف والمنيو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 p-4 max-w-4xl mx-auto">

    <header class="bg-gray-900 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">⚙️ لوحة إدارة الأصناف والمنيو</h1>
            <p class="text-xs text-gray-400">إضافة أصناف، تعديل الأسعار، وتحديد التوفر</p>
        </div>
        <a href="index.html" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">معاينة المنيو 👁️</a>
    </header>

    <!-- نموذج إضافة وجبة جديدة -->
    <section class="bg-white p-4 rounded-xl shadow-sm border mb-6">
        <h2 class="font-bold text-md mb-3 text-red-600">+ إضافة وجبة جديدة</h2>
        <form onsubmit="addNewItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="text" id="new-name" placeholder="اسم الوجبة" required class="border p-2 rounded-lg text-sm">
            <input type="number" id="new-price" placeholder="السعر (د.ع)" required class="border p-2 rounded-lg text-sm">
            <input type="text" id="new-category" placeholder="القسم (مثال: برغر، مقبلات، مشروبات)" required class="border p-2 rounded-lg text-sm">
            <input type="text" id="new-image" placeholder="رابط صورة الوجبة (URL)" class="border p-2 rounded-lg text-sm">
            <textarea id="new-desc" placeholder="وصف الوجبة والمكونات" class="border p-2 rounded-lg text-sm sm:col-span-2"></textarea>
            
            <button type="submit" class="bg-green-600 text-white py-2 rounded-lg font-bold text-sm sm:col-span-2 hover:bg-green-700">
                حفظ وإضافة للمنيو
            </button>
        </form>
    </section>

    <!-- قائمة الوجبات الحالية للتعديل والتحكم -->
    <section class="bg-white p-4 rounded-xl shadow-sm border">
        <h2 class="font-bold text-md mb-3">قائمة الأصناف الحالية</h2>
        <div class="space-y-3" id="admin-items-list"></div>
    </section>

    <script src="app.js"></script>
    <script>
        // تشغيل عرض لوحة التحكم عند فتح الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof renderAdminPage === "function") renderAdminPage();
        });
    </script>
</body>
</html>
