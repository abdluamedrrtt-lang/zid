<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخ زاد | ZAD Kitchen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- رأس الصفحة -->
    <header class="header">
        <div class="logo-container">
            <img src="logo.jpg" alt="مطبخ زاد" class="logo">
        </div>
        <h1>مطبخ زاد</h1>
        <p class="sub-title">ريزو • كرسبي • برغر • غداء عراقي</p>
    </header>

    <!-- تصفية الأقسام -->
    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('الكل')">الكل</button>
        <button class="cat-btn" onclick="filterCategory('ريزو')">ريزو</button>
    </div>

    <!-- قائمة الطعام -->
    <main class="menu-container" id="menuContainer">
        <!-- يتم جلب الوجبات برمجياً من ملف app.js -->
    </main>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar">
        <div class="cart-info">
            إجمالي الحساب: <span id="totalPrice">0</span> د.ع
        </div>
        <button class="cart-btn" onclick="openCart()">
            🛒 عرض السلة (<span id="cartCount">0</span>)
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
