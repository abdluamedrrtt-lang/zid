<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخ زاد | ZAD Kitchen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الهيدر واللوجو -->
    <header class="header">
        <div class="logo-container">
            <img src="logo.png" alt="مطبخ زاد" class="logo-img">
            <h1>مطبخ زاد</h1>
            <p>ريزو • كرسبي • برغر • غداء عراقي</p>
        </div>
    </header>

    <!-- أقسام المنيو -->
    <nav class="categories" id="categories-container">
        <button class="cat-btn active" onclick="filterCategory('الكل')">الكل</button>
    </nav>

    <!-- قائمة الوجبات -->
    <main class="menu-container" id="menu-container">
        <!-- يتم تحميل الوجبات هنا عبر JavaScript -->
    </main>

    <!-- قسم آراء وتقييمات الزبائن -->
    <section class="reviews-section" style="padding: 20px; background: #1a1a1a; margin: 20px 10px 80px 10px; border-radius: 12px; border: 1px solid #333;">
        <h3 style="color: #ff9800; text-align: center; margin-bottom: 15px;">⭐ آراء زبائن مطبخ زاد ⭐</h3>
        
        <div class="reviews-container" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- تقييم 1 -->
            <div class="review-card" style="background: #252525; padding: 12px; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <strong style="color: #fff;">علي الحسين</strong>
                    <span style="color: #ffc107;">⭐⭐⭐⭐⭐</span>
                </div>
                <p style="color: #ccc; font-size: 14px; margin: 0;">الريزو عاشت ايدكم طعم روعة والتوصيل سريع جداً!</p>
            </div>

            <!-- تقييم 2 -->
            <div class="review-card" style="background: #252525; padding: 12px; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <strong style="color: #fff;">أحمد الشمري</strong>
                    <span style="color: #ffc107;">⭐⭐⭐⭐⭐</span>
                </div>
                <p style="color: #ccc; font-size: 14px; margin: 0;">الأكل وصل ساخن والكرانشي مقرمش درجة أولى.</p>
            </div>
        </div>
    </section>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar" onclick="openCartModal()">
        <button class="view-cart-btn">
            🛒 عرض السلة ( <span id="cart-count">0</span> )
        </button>
        <div class="cart-total-preview">
            إجمالي الحساب: <br>
            <span id="cart-total-price">0</span> د.ع
        </div>
    </div>

    <!-- نافذة السلة والطلب (Modal) -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>🛒 سلة الطلبات</h2>
            
            <div id="cart-items" class="cart-items-list">
                <!-- تفاصيل الوجبات المختارة -->
            </div>

            <!-- تحديد الموقع الجغرافي وحساب التوصيل -->
            <div class="location-box">
                <button type="button" class="gps-btn" onclick="getCurrentLocation()">
                    📍 تحديد موقعي للطلب (GPS)
                </button>
                <p id="location-status" class="status-text"></p>
            </div>

            <!-- المجموع وأجور التوصيل -->
            <div class="checkout-summary">
                <p>مجموع الوجبات: <span id="subtotal-price">0</span> د.ع</p>
                <p>أجور التوصيل: <span id="delivery-price">0</span> د.ع</p>
                <hr>
                <h3>المجموع الكلي: <span id="final-total-price">0</span> د.ع</h3>
            </div>

            <!-- معلومات الزبون -->
            <div class="customer-info">
                <input type="text" id="cust-name" placeholder="الاسم الكامل" required>
                <input type="tel" id="cust-phone" placeholder="رقم الهاتف" required>
                <textarea id="cust-notes" placeholder="ملاحظات إضافية (أقرب نقطة دالة، تفاصيل العنوان...)"></textarea>
            </div>

            <button class="send-order-btn" onclick="sendOrderToWhatsApp()">📲 إرسال الطلب عبر الواتساب</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
