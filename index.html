<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخ زاد | ZAD Kitchen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الهيدر واللوجو -->
    <header class="header">
        <div class="logo-container">
            <img src="logo.png" alt="مطبخ زاد" class="logo-img">
            <h1>مطبخ زاد</h1>
            <p>ريزو • كرسبي • برغر • غداء عراقي</p>
        </div>
    </header>

    <!-- أقسام المنيو -->
    <nav class="categories" id="categories-container">
        <button class="cat-btn active" onclick="filterCategory('الكل')">الكل</button>
    </nav>

    <!-- قائمة الوجبات -->
    <main class="menu-container" id="menu-container">
        <!-- يتم تحميل الوجبات هنا عبر JavaScript -->
    </main>

    <!-- قسم آراء وتقييمات الزبائن التفاعلي -->
    <section class="reviews-section" style="padding: 20px; background: #1a1a1a; margin: 20px 10px 80px 10px; border-radius: 12px; border: 1px solid #333;">
        <h3 style="color: #ff9800; text-align: center; margin-bottom: 15px;">⭐ آراء زبائن مطبخ زاد ⭐</h3>
        
        <!-- قائمة عرض التقييمات -->
        <div id="reviews-list" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
            <!-- تظهر التقييمات هنا -->
        </div>

        <!-- نموذج إضافة تقييم جديد -->
        <div style="background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #444;">
            <h4 style="color: #fff; margin-bottom: 10px; font-size: 15px;">✍️ أضف تقييمك ورأيك بالأكل:</h4>
            <form id="add-review-form">
                <input type="text" id="rev-name" placeholder="اسمك الكريم" required style="width: 100%; padding: 10px; margin-bottom: 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: 'Tajawal', sans-serif;">
                
                <select id="rev-stars" style="width: 100%; padding: 10px; margin-bottom: 8px; background: #1a1a1a; border: 1px solid #444; color: #ffc107; border-radius: 6px; box-sizing: border-box; font-family: 'Tajawal', sans-serif;">
                    <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (ممتاز جداً)</option>
                    <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (جيد جداً)</option>
                    <option value="⭐⭐⭐">⭐⭐⭐ (جيد)</option>
                    <option value="⭐⭐">⭐⭐ (مقبول)</option>
                    <option value="⭐">⭐ (سيء)</option>
                </select>

                <textarea id="rev-comment" placeholder="رأيك بالطعم والنظافة والتوصيل..." required style="width: 100%; padding: 10px; margin-bottom: 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: 'Tajawal', sans-serif;"></textarea>

                <button type="submit" style="width: 100%; background: #ff9800; color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif;">نشر التقييم 🌟</button>
            </form>
        </div>
    </section>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar" onclick="openCartModal()">
        <button class="view-cart-btn">
            🛒 عرض السلة ( <span id="cart-count">0</span> )
        </button>
        <div class="cart-total-preview">
            إجمالي الحساب: <br>
            <span id="cart-total-price">0</span> د.ع
        </div>
    </div>

    <!-- نافذة السلة والطلب (Modal) -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>🛒 سلة الطلبات</h2>
            
            <div id="cart-items" class="cart-items-list"></div>

            <div class="location-box">
                <button type="button" class="gps-btn" onclick="getCurrentLocation()">
                    📍 تحديد موقعي للطلب (GPS)
                </button>
                <p id="location-status" class="status-text"></p>
            </div>

            <div class="checkout-summary">
                <p>مجموع الوجبات: <span id="subtotal-price">0</span> د.ع</p>
                <p>أجور التوصيل: <span id="delivery-price">0</span> د.ع</p>
                <hr>
                <h3>المجموع الكلي: <span id="final-total-price">0</span> د.ع</h3>
            </div>

            <div class="customer-info">
                <input type="text" id="cust-name" placeholder="الاسم الكامل" required>
                <input type="tel" id="cust-phone" placeholder="رقم الهاتف" required>
                <textarea id="cust-notes" placeholder="ملاحظات إضافية (أقرب نقطة دالة، تفاصيل العنوان...)"></textarea>
            </div>

            <button class="send-order-btn" onclick="sendOrderToWhatsApp()">📲 إرسال الطلب عبر الواتساب</button>
        </div>
    </div>

    <!-- كود تشغيل التقييمات -->
    <script>
        const defaultReviews = [
            { name: "علي الحسين", stars: "⭐⭐⭐⭐⭐", comment: "الريزو عاشت ايدكم طعم روعة والتوصيل سريع جداً!" },
            { name: "أحمد الشمري", stars: "⭐⭐⭐⭐⭐", comment: "الأكل وصل ساخن والكرانشي مقرمش درجة أولى." }
        ];

        let reviewsData = JSON.parse(localStorage.getItem('zad_reviews')) || defaultReviews;

        function displayReviews() {
            const list = document.getElementById('reviews-list');
            if(!list) return;
            list.innerHTML = reviewsData.map(r => `
                <div style="background: #252525; padding: 12px; border-radius: 8px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <strong style="color: #fff;">${r.name}</strong>
                        <span style="color: #ffc107;">${r.stars}</span>
                    </div>
                    <p style="color: #ccc; font-size: 14px; margin: 0;">${r.comment}</p>
                </div>
            `).join('');
        }

        document.getElementById('add-review-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('rev-name').value.trim();
            const stars = document.getElementById('rev-stars').value;
            const comment = document.getElementById('rev-comment').value.trim();

            reviewsData.unshift({ name, stars, comment });
            localStorage.setItem('zad_reviews', JSON.stringify(reviewsData));
            
            alert('✅ شكراً لك! تم إضافة تقييمك بنجاح.');
            this.reset();
            displayReviews();
        });

        displayReviews();
    </script>

    <script src="app.js"></script>
</body>
</html>
